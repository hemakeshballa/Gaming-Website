<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Arcade — Login</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="card">
    <h1>🕹️ Mini Arcade</h1>
    <p class="subtitle">Log in to play Dino Runner &amp; Snake</p>

    <div class="tabs">
      <div class="tab active" id="tabLogin">Log In</div>
      <div class="tab" id="tabSignup">Sign Up</div>
    </div>

    <form id="authForm">
      <input type="text" id="username" placeholder="Username" autocomplete="username" required>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <div class="error" id="errorMsg"></div>
      <button type="submit" class="primary" id="submitBtn">Log In</button>
    </form>
  </div>

<script>
let mode = 'login';
const tabLogin = document.getElementById('tabLogin');
const tabSignup = document.getElementById('tabSignup');
const submitBtn = document.getElementById('submitBtn');
const errorMsg = document.getElementById('errorMsg');
const form = document.getElementById('authForm');

function setMode(m) {
  mode = m;
  errorMsg.textContent = '';
  if (m === 'login') {
    tabLogin.classList.add('active');
    tabSignup.classList.remove('active');
    submitBtn.textContent = 'Log In';
  } else {
    tabSignup.classList.add('active');
    tabLogin.classList.remove('active');
    submitBtn.textContent = 'Sign Up';
  }
}
tabLogin.addEventListener('click', () => setMode('login'));
tabSignup.addEventListener('click', () => setMode('signup'));

// If already logged in, skip straight to dashboard
fetch('/api/session').then(r => r.json()).then(data => {
  if (data.loggedIn) window.location.href = '/dashboard.html';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.textContent = '';
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const endpoint = mode === 'login' ? '/api/login' : '/api/signup';
  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errorMsg.textContent = data.error || 'Something went wrong.';
      return;
    }
    window.location.href = '/dashboard.html';
  } catch (err) {
    errorMsg.textContent = 'Could not reach the server. Try again.';
  }
});
</script>
</body>
</html>
