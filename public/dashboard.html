<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Arcade — Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="card dash-card">
    <div class="welcome">
      <h1 id="welcomeText">Welcome!</h1>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>

    <div class="game-tile" onclick="window.location.href='/dino.html'">
      <div class="info">
        <h3>🦖 Dino Runner</h3>
        <p>Press Space / ↑ to jump over cacti</p>
      </div>
      <div class="score" id="dinoScore">0</div>
    </div>

    <div class="game-tile" onclick="window.location.href='/snake.html'">
      <div class="info">
        <h3>🐍 Snake</h3>
        <p>Arrow keys to move, eat the food</p>
      </div>
      <div class="score" id="snakeScore">0</div>
    </div>
  </div>

<script>
fetch('/api/session').then(r => r.json()).then(data => {
  if (!data.loggedIn) {
    window.location.href = '/';
    return;
  }
  document.getElementById('welcomeText').textContent = `Hi, ${data.username}!`;
  document.getElementById('dinoScore').textContent = data.scores.dino || 0;
  document.getElementById('snakeScore').textContent = data.scores.snake || 0;
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/';
});
</script>
</body>
</html>
